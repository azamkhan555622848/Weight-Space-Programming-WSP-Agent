[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wsp-agent"
version = "0.2.0"
description = "A chat agent that programs neural networks by reading and editing their weights directly, with no training."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=2",
    "scipy",
    "pandas",
    "sympy",
    "networkx",
    "psutil",
    "safetensors",
    # On Windows, pip's default torch has no GPU support. `wsp doctor` prints the command for your CUDA version.
    "torch>=2.5",
    "anthropic>=2.4",
]

[project.optional-dependencies]
# Any Hugging Face language model as a target.
lm = ["transformers>=5.3", "accelerate", "tokenizers", "huggingface-hub>=1.3,<2"]
# The backdoored ResNet-8 task. Runs without a GPU.
edge = ["datasets>=3", "pyarrow", "pillow"]
# The Qwen3.5-0.8B math task. Needs an NVIDIA GPU. transformers is pinned because the engine patches its internals
# (wsp/tasks/qwen_math/engine.py). flash-linear-attention is optional and is not listed here: it declares
# transformers>=5.6.2, so `wsp setup` installs it with --no-deps.
qwen = [
    "torch==2.10.*",
    "transformers==5.3.0",
    "accelerate",
    "tokenizers",
    "safetensors",
    "huggingface-hub>=1.3,<2",
    "datasets>=3",
    "pyarrow",
    "einops",
    "math-verify[antlr4_13_2]==0.9.0",
    "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
]
openai = ["openai>=2.14"]
tui = ["textual>=8.2,<9"]
all = ["wsp-agent[lm,edge,qwen,openai,tui]"]

[project.urls]
Repository = "https://github.com/azamkhan555622848/Weight-Space-Programming-WSP-Agent"
Issues = "https://github.com/azamkhan555622848/Weight-Space-Programming-WSP-Agent/issues"

[project.scripts]
wsp = "wsp.cli:main"

[tool.setuptools.packages.find]
include = ["wsp*"]
